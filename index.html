<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Y-FETISH — Видео</title>

    <meta
        name="description"
        content="Y-FETISH — видео"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <span class="red">Y</span><span class="white">-FETISH</span>
    </div>

    <div class="header-right">

        <div class="language-box">
            <select id="language">
                <option value="ru">🇷🇺 RU</option>
                <option value="ua">🇺🇦 UA</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>

        <div
            id="menuBtn"
            class="menu-btn"
            aria-label="Меню"
        >
            ☰
        </div>

    </div>

</header>


<!-- =========================
     ЛЕНТА ВИДЕО
========================= -->

<main>

    <div
        class="videos"
        id="videos"
    >

        <!-- ВИДЕО 1 -->

        <article class="video-card">

            <video
                src="videos/video1.mp4"
                playsinline
                muted
                loop
                preload="metadata"
            ></video>

            <div class="video-overlay"></div>

            <div class="video-title">
                Видео 1
            </div>

            <button
                class="sound-button"
                type="button"
            >
                🔇
            </button>

            <div class="play-icon">
                ▶
            </div>

        </article>


        <!-- ВИДЕО 2 -->

        <article class="video-card">

            <video
                src="videos/video2.mp4"

                Видео 2
            </div>

            <button

                type="button"
            >
                🔇
            </button>

            <div class="play-icon">
                ▶
            </div>

        </article>


        <!-- ВИДЕО 3 -->

        <article class="video-card">

            <video
                src="videos/video3.mp4"
                playsinline
                muted
                loop
                preload="metadata"
            ></video>

            <div class="video-overlay"></div>

            <div class="video-title">
                Видео 3
            </div>

            <button
                class="sound-button"
                type="button"
            >
                🔇
            </button>

            <div class="play-icon">
                ▶
            </div>

        </article>

            >
                🔇
            </button>

            <div class="play-icon">
                ▶
            </div>

        </article>

        ================================
        -->

    </div>

</main>
