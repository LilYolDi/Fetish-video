<script>

/* =====================================
   ЗАГРУЗКА ОПУБЛИКОВАННЫХ ВИДЕО
===================================== */

async function loadVideos() {

    const container =
        document.getElementById("videos");


    try {

        const response =
            await fetch("/api/videos");


        if (!response.ok) {

            throw new Error(
                "Ошибка загрузки списка видео"
            );

        }


        const videos =
            await response.json();


        container.innerHTML = "";


        if (
            !Array.isArray(videos) ||
            videos.length === 0
        ) {

            container.innerHTML = `
                <p class="no-videos">
                    Пока нет опубликованных видео.
                </p>
            `;

            return;

        }


        videos.forEach(video => {

            const card =
                document.createElement("div");


            card.className =
                "card";


            card.dataset.title =
                video.title;


            card.innerHTML = `

                <video
                    controls
                    preload="metadata"
                    poster="${video.cover}"
                >

                    <source
                        src="${video.video}"
                        type="video/mp4"
                    >

                    Ваш браузер
                    не поддерживает видео.

                </video>

                <p>
                    ${escapeHTML(video.title)}
                </p>

            `;


            container.appendChild(card);

        });


        setupVideoControls();


    } catch (error) {

        console.error(error);


        container.innerHTML = `
            <p>
                Не удалось загрузить видео.
            </p>
        `;

    }

}


/* =====================================
   ЗАЩИТА НАЗВАНИЯ ОТ HTML
===================================== */

function escapeHTML(text) {

    const element =
        document.createElement("div");

    element.textContent =
        text || "";


    return element.innerHTML;

}


/* =====================================
   УПРАВЛЕНИЕ ВИДЕО
===================================== */

function setupVideoControls() {

    const videos =
        document.querySelectorAll(
            "#videos video"
        );


    videos.forEach(video => {

        video.addEventListener(
            "play",
            () => {

                videos.forEach(other => {

                    if (other !== video) {

                        other.pause();

                    }

                });

            }
        );


        video.addEventListener(
            "dblclick",
            () => {

                if (
                    video.requestFullscreen
                ) {

                    video.requestFullscreen();

                }

            }
        );

    });

}


/* =====================================
   ПОИСК
===================================== */

const search =
    document.getElementById("search");


if (search) {

    search.addEventListener(
        "input",
        function () {

            const value =
                this.value
                .toLowerCase()
                .trim();


            document
                .querySelectorAll(".card")
                .forEach(card => {

                    const title =
                        (
                            card.dataset.title ||
                            ""
                        )
                        .toLowerCase();


                    if (
                        title.includes(value)
                    ) {

                        card.style.display =
                            "";

                    } else {

                        card.style.display =
                            "none";

                    }

                });

        }
    );

}


/* =====================================
   ЗАГРУЗИТЬ ВИДЕО ПРИ ОТКРЫТИИ
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadVideos
);

</script>
