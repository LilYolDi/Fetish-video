<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Y-FETISH</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        <span class="red">Y</span><span class="white">-FETISH</span>
    </div>


    <div class="language-box">

        <select id="language">

            <option value="ru">🇷🇺 RU</option>
            <option value="ua">🇺🇦 UA</option>
            <option value="en">🇬🇧 EN</option>

        </select>

    </div>


    <div
        id="menuBtn"
        class="menu-btn"
    >
        ☰
    </div>

</header>


<!-- =========================
     ВИДЕО
     ПРОПИСЫВАЕМ ПУТИ ЗДЕСЬ
========================= -->

<main>

    <div class="videos">


        <!-- ВИДЕО 1 -->

        <div class="video-card">

            <video
                src="videos/video1.mp4"
                playsinline
                loop
                muted
                controls
            ></video>

            <div class="video-title">
                Видео 1
            </div>

        </div>


        <!-- ВИДЕО 2 -->

        <div class="video-card">

            <video
                src="videos/video2.mp4"
                playsinline
                loop
                muted
                controls
            ></video>

            <div class="video-title">
                Видео 2
            </div>

        </div>


        <!-- ВИДЕО 3 -->

        <div class="video-card">

            <video
                src="videos/video3.mp4"
                playsinline
                loop
                muted
                controls
            ></video>

            <div class="video-title">
                Видео 3
            </div>

        </div>


        <!-- ВИДЕО 4 -->

        <div class="video-card">

            <video
                src="videos/video4.mp4"
                playsinline
                loop
                muted
                controls
            ></video>

            <div class="video-title">
                Видео 4
            </div>

        </div>


    </div>

</main>


<!-- =========================
     БОКОВОЕ МЕНЮ
========================= -->

<nav
    id="sideMenu"
    class="side-menu"
>

    <div
        id="closeBtn"
        class="close-btn"
    >
        ✕
    </div>


    <a href="/index.html">
        🏠 Главная
    </a>


    <a href="#">
        👤 Профиль
    </a>

</nav>


<div id="overlay"></div>


<script>

const menuBtn =
    document.getElementById("menuBtn");

const closeBtn =
    document.getElementById("closeBtn");

const sideMenu =
    document.getElementById("sideMenu");

const overlay =
    document.getElementById("overlay");


/* =========================
   МЕНЮ
========================= */

menuBtn.onclick = function () {

    sideMenu.classList.add("active");

    overlay.classList.add("active");

};


closeBtn.onclick = function () {

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


overlay.onclick = function () {

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


/* =========================
   АВТОПРОИГРЫВАНИЕ
========================= */

const videos =
    document.querySelectorAll(
        ".video-card video"
    );


const observer =
    new IntersectionObserver(

        entries => {

            entries.forEach(entry => {

                const video =
                    entry.target;


                if (entry.isIntersecting) {

                    videos.forEach(other => {

                        if (other !== video) {

                            other.pause();

                        }

                    });


                    video.play()
                        .catch(() => {});

                } else {

                    video.pause();

                }

            });

        },

        {
            threshold: 0.7
        }

    );


videos.forEach(video => {

    observer.observe(video);

});


/* =========================
   ЗВУК
========================= */

videos.forEach(video => {

    video.addEventListener(
        "click",
        function () {

            if (this.muted) {

                this.muted = false;

            }

        }
    );

});

</script>


</body>

</html>
